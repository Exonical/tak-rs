[package]
name = "tak-cli"
description = "TAK-RS command-line tool: CoT codec utilities and debugging harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tak"
path = "src/main.rs"

[dependencies]
tak-core = { workspace = true, features = ["serde"] }
tak-cot = { workspace = true }
tak-network = { workspace = true }
tak-crypto = { workspace = true }
tak-transport = { workspace = true }
tak-state = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { workspace = true }
zeroize = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
